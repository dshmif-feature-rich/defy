AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Dedicated staging host for DEFY PRS static site (S3 + CloudFront).
  Office tests PayPal sandbox payment portal here — not on www.defyprs.com.
  Deploy in us-east-1 (CloudFront + optional ACM later).

Parameters:
  ProjectName:
    Type: String
    Default: defy-staging
    Description: Prefix for resource names

Resources:
  StagingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-site-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  StagingOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-oac'
        Description: OAC for DEFY staging static site
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Map /pay → /pay/index.html (S3 REST origin does not auto-serve directory indexes)
  UrlRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${ProjectName}-url-rewrite'
      AutoPublish: true
      FunctionConfig:
        Comment: Directory index rewrite for Astro static multi-page site
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (!uri.includes('.')) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  StagingDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: DEFY PRS staging site (office testing / PayPal sandbox)
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        IPV6Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt StagingBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt StagingOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          # CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt UrlRewriteFunction.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60

  StagingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StagingBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${StagingBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${StagingDistribution}'

Outputs:
  StagingBucketName:
    Description: S3 bucket for GitHub Actions aws s3 sync
    Value: !Ref StagingBucket
  StagingDistributionId:
    Description: CloudFront distribution ID (for cache invalidation)
    Value: !Ref StagingDistribution
  StagingSiteUrl:
    Description: Office test URL (bookmark this)
    Value: !Sub 'https://${StagingDistribution.DomainName}'
  StagingDomainName:
    Description: CloudFront domain name
    Value: !GetAtt StagingDistribution.DomainName
