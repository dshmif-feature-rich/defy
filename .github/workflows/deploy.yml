name: Deploy production (GitHub Pages)

# Production: www.defyprs.com
# Payment portal: only enabled when production environment secrets are set.
# Office sandbox testing uses the separate "Deploy staging" workflow (S3 + CloudFront).

# Requires GitHub Pages source set to "GitHub Actions" in repo Settings → Pages
# before the first deploy will succeed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install, build, and upload
        uses: withastro/action@v6
        with:
          path: .
          node-version: 24
          package-manager: npm@latest
        env:
          # Custom domain serves the site at the root (not /defy).
          # Apex defyprs.com 301s to www; use www for canonicals.
          SITE_URL: https://www.defyprs.com
          BASE_PATH: /
          PUBLIC_SITE_ENV: production
          # Optional: set these on the "production" GitHub Environment only when going live.
          # Leave unset so /pay shows the contact-office fallback until cutover.
          PUBLIC_PAY_API_BASE: ${{ secrets.PUBLIC_PAY_API_BASE }}
          PUBLIC_PAY_API_KEY: ${{ secrets.PUBLIC_PAY_API_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5